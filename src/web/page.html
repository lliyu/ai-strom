<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ai-storm</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1f; --muted: #6b6b70; --line: #e4e2dc;
    --accent: #3a5ccc; --accent-ink: #fff; --soft: #eef1fb;
    --del-bg: #fde8e8; --del-ink: #a32020; --ins-bg: #e3f5e6; --ins-ink: #17692b;
    --warn: #b25e00; --ok: #17692b; --err: #b42318;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181b; --panel: #202226; --ink: #e9e9ec; --muted: #9a9aa3; --line: #33353b;
      --accent: #7b96ff; --accent-ink: #0d1020; --soft: #262c40;
      --del-bg: #4a2224; --del-ink: #ffb3b3; --ins-bg: #1f3d27; --ins-ink: #9fe3ad;
      --warn: #f0a24a; --ok: #7fd18f; --err: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.65 -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
  button, input, textarea, select { font: inherit; color: inherit; }
  .app { display: grid; grid-template-columns: 340px 1fr; height: 100vh; }
  aside { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  .brand { padding: 14px 52px 10px 16px; border-bottom: 1px solid var(--line); position: relative; }
  .sidetoggle { border: 1px solid var(--line); background: var(--panel); color: var(--muted); border-radius: 8px; width: 30px; height: 30px; cursor: pointer; font-size: 15px; line-height: 1; display: inline-flex; align-items: center; justify-content: center; }
  .sidetoggle:hover { color: var(--ink); border-color: var(--muted); }
  .brand .sidetoggle { position: absolute; right: 12px; top: 12px; }
  #openSide { position: fixed; left: 12px; top: 12px; z-index: 6; display: none; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
  body.side-off .app { grid-template-columns: 1fr; }
  body.side-off aside { display: none; }
  body.side-off #openSide { display: inline-flex; }
  body.side-off .wrap { padding-left: 56px; }
  .brand h1 { margin: 0; font-size: 16px; letter-spacing: .02em; }
  .brand .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .tabs { display: flex; gap: 4px; padding: 10px 12px 0; flex-wrap: wrap; }
  .tab { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 3px 12px; cursor: pointer; color: var(--muted); }
  .tab.on { background: var(--ink); color: var(--panel); border-color: var(--ink); }
  .search { margin: 10px 12px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); width: calc(100% - 24px); }
  .list { overflow: auto; flex: 1; padding: 0 8px 12px; }
  .item { padding: 9px 10px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
  .item:hover { background: var(--bg); }
  .item.on { background: var(--soft); border-color: var(--accent); }
  .item .t { font-weight: 600; }
  .item .m { color: var(--muted); font-size: 12px; }
  .item .p { color: var(--muted); font-size: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .empty { color: var(--muted); padding: 24px 12px; text-align: center; }
  main { overflow: auto; min-height: 0; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 22px 28px 120px; }
  .head { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  .head h2 { margin: 0; font-size: 20px; }
  .chip { font-size: 12px; padding: 1px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .chip.running { color: var(--accent); border-color: var(--accent); }
  .chip.queued { color: var(--warn); border-color: var(--warn); }
  .chip.failed { color: var(--err); border-color: var(--err); }
  .chip.done { color: var(--ok); border-color: var(--ok); }
  .meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-top: 14px; }
  .card h3 { margin: 0 0 8px; font-size: 14px; }
  .pre { white-space: pre-wrap; word-break: break-word; }
  details > summary { cursor: pointer; color: var(--muted); }
  textarea { width: 100%; min-height: 76px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--bg); resize: vertical; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
  .btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 14px; cursor: pointer; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .hint { color: var(--muted); font-size: 12px; }
  .err { color: var(--err); }
  .subtabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-top: 16px; }
  .subtab { background: none; border: none; border-bottom: 2px solid transparent; padding: 6px 12px; cursor: pointer; color: var(--muted); }
  .subtab.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
  .post { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--c, var(--line)); border-radius: var(--radius); padding: 10px 14px; margin-top: 12px; }
  .post .ph { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .post .who { font-weight: 600; }
  .post .sub { color: var(--muted); font-size: 12px; }
  .post .foot { color: var(--muted); font-size: 11px; margin-top: 6px; }
  .post.error { border-left-color: var(--err); }
  .post .body { overflow-wrap: anywhere; }
  .post.fold .body { max-height: 260px; overflow: hidden; -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
  .post .brief { font-weight: 500; }
  .post details { margin-top: 6px; }
  .post details > summary { cursor: pointer; color: var(--accent); font-size: 12px; user-select: none; }
  .post .more { background: none; border: none; color: var(--accent); cursor: pointer; padding: 0; font-size: 12px; margin-top: 4px; }
  .md p { margin: 6px 0; } .md ul, .md ol { margin: 4px 0; padding-left: 22px; } .md h4, .md h5 { margin: 10px 0 4px; font-size: 14px; }
  .md code { background: var(--bg); padding: 0 4px; border-radius: 4px; font-size: 12px; }
  .md pre { background: var(--bg); padding: 8px 10px; border-radius: 6px; overflow: auto; font-size: 12px; }
  .progress { position: sticky; bottom: 0; background: linear-gradient(transparent, var(--bg) 30%); padding: 18px 0 10px; }
  .progress .bar { display: flex; gap: 10px; align-items: center; color: var(--muted); font-size: 13px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1.2s infinite; flex: none; }
  @keyframes pulse { 50% { opacity: .25; } }
  .composer { display: flex; gap: 8px; margin-top: 8px; }
  .composer textarea { min-height: 42px; height: 42px; }
  .field { border-top: 1px solid var(--line); padding: 12px 0; }
  .field:first-child { border-top: none; }
  .field .fl { font-weight: 600; margin-bottom: 4px; display: flex; gap: 8px; align-items: baseline; }
  .diff { white-space: pre-wrap; word-break: break-word; }
  .diff del { background: var(--del-bg); color: var(--del-ink); text-decoration: line-through; }
  .diff ins { background: var(--ins-bg); color: var(--ins-ink); text-decoration: none; }
  .md h3 { margin: 4px 0 10px; font-size: 17px; }
  .docbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 12px 0 4px; }
  .docmeta { font-size: 12px; color: var(--muted); margin: 4px 0 8px; word-break: break-all; }
  .dl { white-space: pre-wrap; word-break: break-word; padding: 1px 6px; font-size: 13px; line-height: 1.6; border-left: 3px solid transparent; }
  .dl.del { background: var(--del-bg); color: var(--del-ink); border-left-color: var(--del-ink); }
  .dl.ins { background: var(--ins-bg); color: var(--ins-ink); border-left-color: var(--ins-ink); }
  .dl.mod { border-left-color: var(--accent); }
  .dl.mod del { background: var(--del-bg); color: var(--del-ink); } .dl.mod ins { background: var(--ins-bg); color: var(--ins-ink); text-decoration: none; }
  .dl.skip { color: var(--muted); font-style: italic; }
  .applybar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 12px 14px; background: var(--soft); border-radius: var(--radius); margin-top: 14px; }
  .newmsg { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); background: var(--accent); color: var(--accent-ink); border: none; border-radius: 999px; padding: 6px 16px; cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,.18); font-weight: 600; z-index: 5; }
  @media (min-width: 821px) { body:not(.side-off) .newmsg { left: calc(170px + 50%); } }
  .toast { position: fixed; right: 18px; bottom: 18px; background: var(--ink); color: var(--panel); padding: 9px 14px; border-radius: 8px; max-width: 420px; box-shadow: 0 6px 24px rgba(0,0,0,.2); }
  .welcome { color: var(--muted); padding-top: 12vh; text-align: center; }
  .newbtn { margin: 10px 12px 0; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: none; background: var(--panel); padding: 5px 14px; cursor: pointer; color: var(--muted); }
  .seg button.on { background: var(--ink); color: var(--panel); }
  .form label { display: block; font-weight: 600; margin: 14px 0 6px; }
  .form input[type=text], .form select { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; background: var(--bg); }
  .form textarea { min-height: 140px; }
  .seats { display: grid; gap: 8px; }
  .seat { border: 1px solid var(--line); border-left: 4px solid var(--c, var(--line)); border-radius: 8px; padding: 8px 10px; background: var(--bg); }
  .seat .st { display: grid; grid-template-columns: minmax(120px, 1.1fr) 92px minmax(110px, 1fr) minmax(120px, 1.2fr) 30px; gap: 6px; align-items: center; }
  .form .seat select, .form .seat input[type=text] { padding: 5px 8px; background: var(--panel); }
  .seat textarea { min-height: 40px; height: 52px; margin-top: 6px; background: var(--panel); font-size: 13px; }
  .seat .del { border: none; background: none; color: var(--muted); cursor: pointer; font-size: 15px; }
  .seat .del:hover { color: var(--err); }
  .lnbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
  .lnbar select { width: auto !important; }
  .form label .btn { font-weight: 400; font-size: 12px; padding: 1px 10px; margin-left: 8px; }
  @media (max-width: 640px) { .seat .st { grid-template-columns: 1fr 1fr; } .seat .del { justify-self: end; } }
  .chip.lark { color: #2a7de1; border-color: #2a7de1; }
  .chip.web { color: var(--muted); }
  .post.followup-start { margin-top: 22px; }
  .divider { margin: 22px 0 4px; color: var(--muted); font-size: 12px; display: flex; gap: 8px; align-items: center; }
  .divider::before, .divider::after { content: ''; flex: 1; border-top: 1px dashed var(--line); }
  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; height: auto; }
    aside { max-height: 46vh; border-right: none; border-bottom: 1px solid var(--line); }
    .wrap { padding: 16px 16px 120px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">
      <h1>ai-storm</h1>
      <button class="sidetoggle" id="closeSide" title="收起侧边栏（快捷键 [ ）" aria-label="收起侧边栏">⟨</button>
      <div class="sub" id="status">连接中…</div>
    </div>
    <div class="tabs" id="tabs"></div>
    <button class="btn primary newbtn" id="new">＋ 新讨论</button>
    <input class="search" id="search" placeholder="搜索">
    <div class="list" id="list"></div>
  </aside>
  <button class="sidetoggle" id="openSide" title="展开侧边栏（快捷键 [ ）" aria-label="展开侧边栏">☰</button>
  <main><div class="wrap" id="main"><div class="welcome">左边「讨论」里是群里和网页上的全部讨论；「脑洞 / 梗概 / 总纲」里挑一项可以做作品打磨。</div></div></main>
</div>
<script>
const TABS = [['runs', '讨论'], ['idea', '脑洞'], ['premise', '梗概'], ['outline', '总纲']];
const TYPE_LABEL = { idea: '脑洞', premise: '梗概', outline: '总纲' };
const MODE_LABEL = { decision: '方案讨论', brainstorm: '脑洞风暴', refine: '作品打磨' };
const MODE_SHORT = { decision: '方案', brainstorm: '脑洞', refine: '打磨' };
const CHANNEL_LABEL = { lark: '群里', web: '网页', 'dry-run': 'dry-run' };
const STATUS_LABEL = { queued: '排队中', running: '进行中', done: '已结束', failed: '失败', idle: '已结束' };
const COLORS = { blue: '#3370ff', wathet: '#4bb3f5', turquoise: '#14c0b0', green: '#34a853', yellow: '#e6b800', orange: '#f08a24', red: '#e5484d', carmine: '#c2185b', violet: '#8e5cf7', purple: '#7b3fbf', indigo: '#4f5bd5', grey: '#8f959e' };
const FIELD_LABELS = {
  content: '内容', angle: '创意方向', fromMaterial: '素材延伸', marketRef: '借鉴榜单', coreIdea: '核心创意', identityRole: '原身份的分量',
  title: '书名', logline: '一句话梗概', protagonist: '主角', goal: '目标', obstacle: '阻碍', goldenFinger: '金手指',
  goldenFingerCost: '金手指的边界', goldenFingerGrowth: '金手指的成长', sellingPoint: '卖点', hook: '开篇钩子', differentiation: '差异点',
  mainLine: '主线', coreConflict: '核心矛盾', ending: '结局方向', world: '世界观', growthSystem: '成长体系', characters: '主要人物',
  summary: '概要', climax: '卷末高潮', estimatedChapters: '预计章数',
};

const S = { tab: 'runs', form: { mode: 'decision' }, items: [], runs: [], q: '', sel: null, run: null, sub: 'talk', es: null, status: null, revIdx: null, docIdx: null, docDiff: false };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { 'content-type': 'application/json', ...(opts.headers || {}) } });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
  return body;
}
function toast(text, ms = 3200) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = text; document.body.append(t);
  setTimeout(() => t.remove(), ms);
}

// ---------- 极简 Markdown：加粗、行内代码、列表、代码块、小标题 ----------
function inline(s) {
  return esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
}
function md(text) {
  const out = []; let list = null; let code = null;
  const close = () => { if (list) { out.push(`</${list}>`); list = null; } };
  for (const line of String(text ?? '').split('\n')) {
    if (code !== null) { if (/^```/.test(line)) { out.push(`<pre>${esc(code)}</pre>`); code = null; } else code += (code ? '\n' : '') + line; continue; }
    if (/^```/.test(line)) { close(); code = ''; continue; }
    let m;
    if ((m = /^\s*[-*]\s+(.*)$/.exec(line))) { if (list !== 'ul') { close(); out.push('<ul>'); list = 'ul'; } out.push(`<li>${inline(m[1])}</li>`); continue; }
    if ((m = /^\s*\d+[.、)]\s+(.*)$/.exec(line))) { if (list !== 'ol') { close(); out.push('<ol>'); list = 'ol'; } out.push(`<li>${inline(m[1])}</li>`); continue; }
    close();
    if ((m = /^(#{1,6})\s+(.*)$/.exec(line))) { const h = Math.min(m[1].length + 2, 5); out.push(`<h${h}>${inline(m[2])}</h${h}>`); continue; }
    if (line.trim()) out.push(`<p>${inline(line)}</p>`);
  }
  if (code !== null) out.push(`<pre>${esc(code)}</pre>`);
  close();
  return `<div class="md">${out.join('')}</div>`;
}

// ---------- 修订版对比 ----------
function flatten(fields) {
  const rows = [];
  const text = (v) => (v === null || v === undefined ? '' : String(v));
  const walk = (obj, prefix) => {
    for (const [k, v] of Object.entries(obj)) {
      if (k === 'characters' && Array.isArray(v)) rows.push({ key: `${prefix}characters`, label: FIELD_LABELS.characters, value: v.map((c) => `${c.name}（${c.role}）：${c.description}`).join('\n') });
      else if (k === 'volumes' && Array.isArray(v)) v.forEach((vol, i) => { for (const [vk, vv] of Object.entries(vol)) rows.push({ key: `volumes.${i}.${vk}`, label: `第 ${i + 1} 卷 · ${vk === 'title' ? '卷名' : FIELD_LABELS[vk] || vk}`, value: text(vv) }); });
      else if (v && typeof v === 'object' && !Array.isArray(v)) walk(v, `${prefix}${k}.`);
      else rows.push({ key: `${prefix}${k}`, label: FIELD_LABELS[k] || k, value: Array.isArray(v) ? v.join('、') : text(v) });
    }
  };
  walk(fields, '');
  return rows;
}
function tokens(s) { return String(s).match(/[一-鿿]|[A-Za-z0-9_]+|\s+|[^一-鿿A-Za-z0-9_\s]/g) || []; }
function diffHtml(a, b) {
  const x = tokens(a), y = tokens(b);
  if (x.length * y.length > 4e6) return `<del>${esc(a)}</del><ins>${esc(b)}</ins>`;
  const n = x.length, m = y.length, dp = Array.from({ length: n + 1 }, () => new Uint32Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) dp[i][j] = x[i] === y[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const out = []; let i = 0, j = 0;
  const push = (t, s) => { const last = out[out.length - 1]; if (last && last.t === t) last.s += s; else out.push({ t, s }); };
  while (i < n && j < m) { if (x[i] === y[j]) { push('=', x[i]); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) push('-', x[i++]); else push('+', y[j++]); }
  while (i < n) push('-', x[i++]); while (j < m) push('+', y[j++]);
  return out.map((o) => (o.t === '=' ? esc(o.s) : o.t === '-' ? `<del>${esc(o.s)}</del>` : `<ins>${esc(o.s)}</ins>`)).join('');
}
// 主文档两版之间按行对比：改了一行的显示行内差异，大段没变的折叠
function lineDiffHtml(a, b) {
  const x = a ? String(a).split('\n') : [], y = b ? String(b).split('\n') : [];
  const n = x.length, m = y.length;
  if (n * m > 4e6) return `<div class="dl del">${esc(a)}</div><div class="dl ins">${esc(b)}</div>`;
  const dp = Array.from({ length: n + 1 }, () => new Uint32Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) dp[i][j] = x[i] === y[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const ops = []; let i = 0, j = 0;
  while (i < n && j < m) { if (x[i] === y[j]) { ops.push({ t: '=', s: x[i] }); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) ops.push({ t: '-', s: x[i++] }); else ops.push({ t: '+', s: y[j++] }); }
  while (i < n) ops.push({ t: '-', s: x[i++] }); while (j < m) ops.push({ t: '+', s: y[j++] });
  const out = [];
  for (let k = 0; k < ops.length;) {
    if (ops[k].t === '=') {
      let e = k; while (e < ops.length && ops[e].t === '=') e++;
      const run = ops.slice(k, e).map((o) => o.s);
      // 没变的段落只留首尾各 2 行
      if (run.length > 6 && k > 0 && e < ops.length) out.push(...run.slice(0, 2).map((l) => `<div class="dl">${esc(l) || '&nbsp;'}</div>`), `<div class="dl skip">…… ${run.length - 4} 行没变 ……</div>`, ...run.slice(-2).map((l) => `<div class="dl">${esc(l) || '&nbsp;'}</div>`));
      else if (run.length > 4 && (k === 0 || e === ops.length)) { const keep = k === 0 ? run.slice(-2) : run.slice(0, 2); if (k === 0) out.push(`<div class="dl skip">…… ${run.length - 2} 行没变 ……</div>`); out.push(...keep.map((l) => `<div class="dl">${esc(l) || '&nbsp;'}</div>`)); if (k !== 0) out.push(`<div class="dl skip">…… ${run.length - 2} 行没变 ……</div>`); }
      else out.push(...run.map((l) => `<div class="dl">${esc(l) || '&nbsp;'}</div>`));
      k = e; continue;
    }
    let e = k; while (e < ops.length && ops[e].t !== '=') e++;
    const del = ops.slice(k, e).filter((o) => o.t === '-').map((o) => o.s), ins = ops.slice(k, e).filter((o) => o.t === '+').map((o) => o.s);

function compare(before, after) {

// 绑定阵容编辑；onChange 在阵容是否可用变化时调用（用来启用 / 禁用开始按钮）
function bindLineup(mode, onChange) {

  };

}

  if (!b) { b = document.createElement('button'); b.id = 'newmsg'; b.className = 'newmsg'; b.onclick = toBottom; document.body.append(b); }
  b.textContent = `${unseen} 条新消息 ↓`;
}
function hideNewMsg() { unseen = 0; $('newmsg')?.remove(); }
const onScroll = () => { if (unseen && nearBottom()) hideNewMsg(); };
document.querySelector('main').addEventListener('scroll', onScroll, { passive: true });
window.addEventListener('scroll', onScroll, { passive: true });
function appendPost(p, prev) {
  const box = $('posts'); if (!box) return;
  const follow = nearBottom(); // 要在插入之前判断
  box.insertAdjacentHTML('beforeend', divider(p, prev) + postHtml(p));
  if (follow) { const sc = scroller(); sc.scrollTop = sc.scrollHeight; } // 直接跳到底：平滑滚动没滚完时，下一条消息会误以为你离开了底部
  else { unseen += 1; showNewMsg(); }
}
function ago(at) { const s = Math.max(0, Math.round((Date.now() - Date.parse(at)) / 1000)); return s < 60 ? `${s}s` : `${Math.floor(s / 60)}m${String(s % 60).padStart(2, '0')}s`; }
function renderProgress() {
  const box = $('progress'); if (!box || !S.run) return;
  const p = S.run.progress || {};
  const running = p.status === 'running', queued = p.status === 'queued';
  const who = (p.speaking || []).map((s) => `${esc(s.name)} 在写${s.round && !['汇总', '修订版', '追问判断'].includes(s.stage) ? `第 ${s.round} 轮` : ''}${esc(s.stage)}（${ago(s.at)}）`).join('；');
  const line = queued ? `排队中${p.queuedAhead ? `，前面还有 ${p.queuedAhead} 场` : ''}…`
    : running ? (who || '准备中…')
    : p.status === 'failed' ? `<span class="err">失败：${esc(p.error || '')}</span>` : '';
  const canTalk = running;
  const canAsk = !running && !queued && S.run.canFollowUp;
  const lark = S.run.channel === 'lark';
  const refine = S.run.mode === 'refine';
  box.querySelector('.bar').innerHTML = line ? `${running || queued ? '<span class="dot"></span>' : ''}<span>${line}</span>` : '';
  const comp = box.querySelector('.composer');
  const mode = canTalk ? 'talk' : canAsk ? 'ask' : 'none';
  if (comp.dataset.mode !== mode) {
    comp.dataset.mode = mode;
    comp.innerHTML = mode === 'talk'
      ? `<textarea id="say" placeholder="插话：下一轮开始时交给所有模型${lark ? '，群里也会出一张卡片' : ''}${refine ? '（例如：别动主角的名字；结局我想要开放式）' : ''}"></textarea><button class="btn primary" id="send">插话</button>`
      : mode === 'ask'
        ? `<textarea id="say" placeholder="追问：${refine ? '主编' : '主席'}判断直接回答还是重新讨论${refine ? '；重新讨论后会重写修订版' : ''}${lark ? '。这是群里的讨论，追问过程会发到群里' : ''}"></textarea><button class="btn primary" id="send">追问</button>`
        : S.run.expired ? `<span class="hint">已超过保留期，会话已清理，不能再追问${refine ? '；修订版仍然可以写回' : ''}。</span>` : '';
    const send = $('send');
    if (send) send.onclick = async () => {
      const text = $('say').value.trim(); if (!text) return;
      send.disabled = true;
      try {
        if (mode === 'talk') { await api(`/api/runs/${S.run.number}/interject`, { method: 'POST', body: JSON.stringify({ text }) }); toast('已收到，下一轮开始时交给模型'); }
        else { const r = await api(`/api/runs/${S.run.number}/followup`, { method: 'POST', body: JSON.stringify({ question: text }) }); toast(r.lark ? '追问已排队，过程会发到群里' : '追问已排队'); }
        $('say').value = '';
      } catch (e) { toast(e.message); }
      send.disabled = false;
    };
  }
}
function renderRun() {
  const r = S.run, p = r.progress || {};
  const status = p.status === 'idle' ? 'done' : p.status;
  const revs = r.revisions?.length ? r.revisions : r.revision ? [r.revision] : [];
  const refine = r.mode === 'refine';
  const chips = `<span class="chip ${status}">${STATUS_LABEL[status] || status}</span><span class="chip">${MODE_LABEL[r.mode] || r.mode}</span><span class="chip ${r.channel}">${CHANNEL_LABEL[r.channel] || r.channel}</span>${r.mock ? '<span class="chip">mock</span>' : ''}`;
  const title = refine && r.subject ? `${TYPE_LABEL[r.subject.type]}「${esc(r.subject.title)}」` : esc((r.topic || '').split('\n')[0].slice(0, 80));
  const docs = r.docs || [];
  const docTab = ['doc', docs.length ? `文档 · 第 ${docs[docs.length - 1].version} 版` : '文档（还没有）'];
  const tabs = refine
    ? [['talk', '讨论'], docTab, ['rev', `修订版${revs.length ? '' : '（还没有）'}`], ['orig', '原稿']]
    : docs.length || !r.summary ? [['talk', '讨论'], docTab] : [['talk', '讨论'], ['conclusion', '结论（旧版汇总）']];
  $('main').innerHTML = `
    <div class="head"><h2>#${r.number} · ${title}</h2>${chips}</div>
    <div class="meta">${refine ? `作者的要求：${esc(r.topic || '（没有额外要求）')}` : (r.topic || '').includes('\n') ? `<details><summary>完整议题</summary><div class="pre">${esc(r.topic)}</div></details>` : ''}${r.code ? `代码：${r.code.auto ? '调研员按议题定位' : esc(r.code.repos.join('；'))}` : ''}${r.followUps.length ? ` · 追问 ${r.followUps.length} 次` : ''}</div>
    <div class="subtabs">${tabs.map(([k, l]) => `<button class="subtab ${S.sub === k ? 'on' : ''}" data-sub="${k}">${l}</button>`).join('')}</div>
    <div id="pane"></div>`;
  const pane = $('pane');
  if (S.sub === 'talk') {
    pane.innerHTML = `<div id="posts">${postsHtml(r.posts)}</div><div class="progress" id="progress"><div class="bar"></div><div class="composer"></div></div>`;
    renderProgress();
  } else if (S.sub === 'conclusion') {
    const asked = r.followUps.filter((f) => f.answer);
    pane.innerHTML = r.conclusion
      ? `<div class="card">${md(r.conclusion)}</div>${asked.length ? `<div class="card"><h3>追问</h3>${asked.map((f) => `<details style="margin-top:8px"><summary>${esc(f.question)}（${f.handling === 'discuss' ? '重新讨论' : '直接回答'}）</summary>${md(f.answer)}</details>`).join('')}</div>` : ''}`
      : `<div class="card hint">${status === 'running' || status === 'queued' ? '讨论结束后这里显示主席的汇总。' : '这场讨论没有汇总。'}</div>`;
  } else if (S.sub === 'doc') {
    if (!docs.length) { pane.innerHTML = `<div class="card hint">${status === 'running' || status === 'queued' ? '讨论结束后主席会写主文档，主笔核对后发在这里。' : r.docFailed ? '主席没能写出主文档。「讨论」页最后有一张程序整理的结果（各主笔的最终方案、评审最后提的阻断、没核实的问题）。可以在终端运行 node src/cli.js doc ' + r.number + ' 补写。' : r.summary ? '这场讨论还没有主文档（旧讨论只有汇总）。可以在终端运行 node src/cli.js doc ' + r.number + ' 补写。' : '这场讨论没有主文档。'}</div>`; return; }
    const idx = Math.min(S.docIdx ?? docs.length - 1, docs.length - 1);
    const d = docs[idx], prev = docs[idx - 1];
    const diff = S.docDiff && prev;
    const check = d.check ? (d.check.issues ? `主笔核对提了 ${d.check.issues} 份意见${d.check.fixed ? '，已按意见修改' : ''}` : '主笔核对没有意见') : '';
    const atts = Object.entries(d.attachments || {});
    const gone = diff ? Object.keys(prev.attachments || {}).filter((k) => !(k in (d.attachments || {}))) : [];
    const asked = r.followUps.filter((f) => f.question);
    pane.innerHTML = `
      <div class="docbar">${docs.map((v, i) => `<button class="btn ${i === idx ? 'primary' : ''}" data-docv="${i}" title="${esc(v.reason)}">第 ${v.version} 版</button>`).join('')}
        ${prev ? `<button class="btn" data-docdiff="1">${diff ? '看全文' : `和第 ${prev.version} 版对比`}</button>` : ''}</div>
      <div class="docmeta">${esc(d.reason)} · ${new Date(d.at).toLocaleString('zh-CN', { hour12: false })}${check ? ` · ${check}` : ''}${idx === docs.length - 1 && r.docFile ? `<br>本机文件：${esc(r.docFile)}` : ''}</div>
      <div class="card">${diff ? lineDiffHtml(prev.text, d.text) : md(d.text)}</div>
      ${atts.map(([title, text]) => `<div class="card"><details ${diff ? 'open' : ''}><summary>附录《${esc(title)}》${diff && !(title in (prev.attachments || {})) ? ' <span class="chip">新增</span>' : ''}</summary>${diff ? lineDiffHtml(prev.attachments?.[title] ?? '', text) : md(text)}</details></div>`).join('')}
      ${gone.map((title) => `<div class="card hint">附录《${esc(title)}》在这一版删掉了</div>`).join('')}
      ${asked.length ? `<div class="card"><h3>追问记录</h3>${asked.map((f) => `<details style="margin-top:8px"><summary>${esc(f.question)}（${f.handling === 'discuss' ? '重新讨论' : '直接回答'}${f.doc ? ` → 第 ${f.doc} 版` : ''}）</summary>${md(f.answer || '（没有结论）')}</details>`).join('')}</div>` : ''}`;
  } else if (S.sub === 'orig') {
    pane.innerHTML = `<div class="card"><div class="pre">${esc(r.subject.current)}</div></div><div class="card"><details><summary>背景</summary><div class="pre" style="margin-top:8px">${esc(r.subject.background)}</div></details></div>`;
  } else {
    if (!revs.length) { pane.innerHTML = `<div class="card hint">${status === 'running' || status === 'queued' ? '讨论结束后主编会写出修订版。' : '这场打磨没有产出修订版。可以追问「按汇总重写修订版」。'}</div>`; return; }
    const idx = S.revIdx ?? revs.length - 1;
    const rev = revs[idx];
    const rows = compare(r.subject.fields, rev.fields);
    const isLatest = idx === revs.length - 1;
    const appliedThis = r.applied?.revisionAt === rev.at;
    pane.innerHTML = `
      ${revs.length > 1 ? `<div class="row"><span class="hint">版本：</span>${revs.map((v, i) => `<button class="btn ${i === idx ? 'primary' : ''}" data-rev="${i}">${i === 0 ? '讨论结束' : `追问后 ${i}`}</button>`).join('')}</div>` : ''}
      <div class="applybar">
        <span>和原稿相比改了 <b>${rows.length}</b> 处。${appliedThis ? `已于 ${new Date(r.applied.at).toLocaleString('zh-CN')} 写回墨稿。` : r.applied ? '之前写回过另一版。' : ''}</span>
        ${isLatest && !appliedThis && rows.length ? `<button class="btn primary" id="apply" ${r.mock || status === 'running' || status === 'queued' ? 'disabled' : ''}>写回墨稿</button>` : ''}
        <span class="hint">${r.mock ? 'mock 演练的修订版不写回。' : isLatest ? '写回会替换墨稿里的这一项；总纲写回前墨稿会自动存一份历史版本。' : '只能写回最新一版。'}</span>
      </div>
      <div class="card">${rows.length ? rows.map((x) => `<div class="field"><div class="fl">${esc(x.label)}${x.before === null ? '<span class="chip">新增</span>' : x.after === null ? '<span class="chip">删除</span>' : ''}</div><div class="diff">${diffHtml(x.before ?? '', x.after ?? '')}</div></div>`).join('') : '<span class="hint">修订版和原稿一样。</span>'}</div>`;
    const btn = $('apply');
    if (btn) btn.onclick = async () => {
      const ok = confirm(`确认把修订版写回墨稿？\n\n会替换${TYPE_LABEL[r.subject.type]}「${r.subject.title}」的 ${rows.length} 处内容。${r.subject.type === 'outline' ? '\n写回前墨稿会存一份历史版本，可以在大纲页恢复。' : '\n墨稿里没有历史版本；原稿在这里的「原稿」页能看到。'}`);
      if (!ok) return;
      btn.disabled = true;
      try { await api(`/api/runs/${r.number}/apply`, { method: 'POST', body: JSON.stringify({ revisionAt: rev.at }) }); toast('已写回墨稿'); S.run = await api(`/api/runs/${r.number}`); renderRun(); loadRuns(); loadItems(); }
      catch (e) { toast(e.message, 6000); btn.disabled = false; }
    };
  }
}

// ---------- 事件 ----------
document.addEventListener('click', (ev) => {
  const t = ev.target.closest('[data-tab],[data-type],[data-run],[data-sub],[data-rev],[data-docv],[data-docdiff],.more');
  if (!t) return;
  if (t.matches('.more')) { const post = t.closest('.post'); post.classList.remove('fold'); t.remove(); return; }
  ev.preventDefault();
  if (t.dataset.tab) { S.tab = t.dataset.tab; renderTabs(); renderList(); if (S.tab === 'runs') loadRuns(); }
  else if (t.dataset.run) openRun(Number(t.dataset.run), 'talk');
  else if (t.dataset.type) openItem(t.dataset.type, t.dataset.id);
  else if (t.dataset.sub) { hideNewMsg(); S.sub = t.dataset.sub; renderRun(); }
  else if (t.dataset.rev) { S.revIdx = Number(t.dataset.rev); renderRun(); }
  else if (t.dataset.docv) { S.docIdx = Number(t.dataset.docv); renderRun(); }
  else if (t.dataset.docdiff) { S.docDiff = !S.docDiff; renderRun(); }
});
$('search').addEventListener('input', (e) => { S.q = e.target.value; renderList(); });
$('new').onclick = () => openForm();
// 侧边栏收起 / 展开：记在本机浏览器里，下次打开保持
function setSide(off) {
  document.body.classList.toggle('side-off', off);
  try { localStorage.setItem('ai-storm.sideOff', off ? '1' : '0'); } catch { /* 隐私模式等存不了就算了 */ }
}
try { if (localStorage.getItem('ai-storm.sideOff') === '1') document.body.classList.add('side-off'); } catch { /* 同上 */ }
$('closeSide').onclick = () => setSide(true);
$('openSide').onclick = () => setSide(false);
document.addEventListener('keydown', (ev) => {
  if (ev.key !== '[' || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  if (ev.target instanceof Element && ev.target.closest('input, textarea, select, [contenteditable]')) return; // 打字时不触发
  ev.preventDefault();
  setSide(!document.body.classList.contains('side-off'));
});
renderTabs();
loadStatus().then(() => Promise.all([loadItems(), loadRuns()]));
setInterval(loadStatus, 10000);
setInterval(loadRuns, 10000);
</script>
