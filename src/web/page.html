<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ai-storm</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1f; --muted: #6b6b70; --line: #e4e2dc;
    --accent: #3a5ccc; --accent-ink: #fff; --soft: #eef1fb;
    --del-bg: #fde8e8; --del-ink: #a32020; --ins-bg: #e3f5e6; --ins-ink: #17692b;
    --warn: #b25e00; --ok: #17692b; --err: #b42318;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181b; --panel: #202226; --ink: #e9e9ec; --muted: #9a9aa3; --line: #33353b;
      --accent: #7b96ff; --accent-ink: #0d1020; --soft: #262c40;
      --del-bg: #4a2224; --del-ink: #ffb3b3; --ins-bg: #1f3d27; --ins-ink: #9fe3ad;
      --warn: #f0a24a; --ok: #7fd18f; --err: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.65 -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
  button, input, textarea, select { font: inherit; color: inherit; }
  .app { display: grid; grid-template-columns: 340px 1fr; height: 100vh; }
  aside { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  .brand { padding: 14px 52px 10px 16px; border-bottom: 1px solid var(--line); position: relative; }
  .sidetoggle { border: 1px solid var(--line); background: var(--panel); color: var(--muted); border-radius: 8px; width: 30px; height: 30px; cursor: pointer; font-size: 15px; line-height: 1; display: inline-flex; align-items: center; justify-content: center; }
  .sidetoggle:hover { color: var(--ink); border-color: var(--muted); }
  .brand .sidetoggle { position: absolute; right: 12px; top: 12px; }
  #openSide { position: fixed; left: 12px; top: 12px; z-index: 6; display: none; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
  body.side-off .app { grid-template-columns: 1fr; }
  body.side-off aside { display: none; }
  body.side-off #openSide { display: inline-flex; }
  body.side-off .wrap { padding-left: 56px; }
  .brand h1 { margin: 0; font-size: 16px; letter-spacing: .02em; }
  .brand .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .tabs { display: flex; gap: 4px; padding: 10px 12px 0; flex-wrap: wrap; }
  .tab { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 3px 12px; cursor: pointer; color: var(--muted); }
  .tab.on { background: var(--ink); color: var(--panel); border-color: var(--ink); }
  .search { margin: 10px 12px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); width: calc(100% - 24px); }
  .filters { display: flex; gap: 6px; align-items: center; margin: -4px 12px 8px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .filters select { border: 1px solid var(--line); border-radius: 6px; background: var(--bg); padding: 2px 4px; font-size: 12px; }
  .filters label { display: inline-flex; gap: 3px; align-items: center; cursor: pointer; }
  .head .ops { margin-left: auto; display: flex; gap: 6px; }
  .head .ops button { font-size: 12px; padding: 2px 10px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--muted); cursor: pointer; }
  .head .ops button:hover:not(:disabled) { color: var(--ink); border-color: var(--muted); }
  .head .ops button.danger:hover:not(:disabled) { color: #e5484d; border-color: #e5484d; }
  .head .ops button:disabled { opacity: .45; cursor: not-allowed; }
  .list { overflow: auto; flex: 1; padding: 0 8px 12px; }
  .item { padding: 9px 10px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
  .item:hover { background: var(--bg); }
  .item.on { background: var(--soft); border-color: var(--accent); }
  .item .t { font-weight: 600; }
  .item .m { color: var(--muted); font-size: 12px; }
  .item .p { color: var(--muted); font-size: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .empty { color: var(--muted); padding: 24px 12px; text-align: center; }
  main { overflow: auto; min-height: 0; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 22px 28px 120px; }
  .head { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  .head h2 { margin: 0; font-size: 20px; }
  .chip { font-size: 12px; padding: 1px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .chip.running { color: var(--accent); border-color: var(--accent); }
  .chip.queued { color: var(--warn); border-color: var(--warn); }
  .chip.failed { color: var(--err); border-color: var(--err); }
  .chip.done { color: var(--ok); border-color: var(--ok); }
  .meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-top: 14px; }
  .card h3 { margin: 0 0 8px; font-size: 14px; }
  .pre { white-space: pre-wrap; word-break: break-word; }
  details > summary { cursor: pointer; color: var(--muted); }
  textarea { width: 100%; min-height: 76px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--bg); resize: vertical; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
  .btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 14px; cursor: pointer; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  a.btn { color: inherit; text-decoration: none; }
  .hint { color: var(--muted); font-size: 12px; }
  .pick { display: inline-flex; gap: 4px; align-items: center; font-size: 13px; }
  .err { color: var(--err); }
  .subtabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-top: 16px; }
  .subtab { background: none; border: none; border-bottom: 2px solid transparent; padding: 6px 12px; cursor: pointer; color: var(--muted); }
  .subtab.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
  .post { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--c, var(--line)); border-radius: var(--radius); padding: 10px 14px; margin-top: 12px; }
  .post .ph { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .post .who { font-weight: 600; }
  .post .sub { color: var(--muted); font-size: 12px; }
  .post .foot { color: var(--muted); font-size: 11px; margin-top: 6px; }
  .post.error { border-left-color: var(--err); }
  .post .body { overflow-wrap: anywhere; }
  .post.fold .body { max-height: 260px; overflow: hidden; -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
  .post .brief { font-weight: 500; }
  .post details { margin-top: 6px; }
  .post details > summary { cursor: pointer; color: var(--accent); font-size: 12px; user-select: none; }
  .post .more { background: none; border: none; color: var(--accent); cursor: pointer; padding: 0; font-size: 12px; margin-top: 4px; }
  .md p { margin: 6px 0; } .md ul, .md ol { margin: 4px 0; padding-left: 22px; } .md h4, .md h5 { margin: 10px 0 4px; font-size: 14px; }
  .md code { background: var(--bg); padding: 0 4px; border-radius: 4px; font-size: 12px; }
  .md pre { background: var(--bg); padding: 8px 10px; border-radius: 6px; overflow: auto; font-size: 12px; }
  .progress { position: sticky; bottom: 0; background: linear-gradient(transparent, var(--bg) 30%); padding: 18px 0 10px; }
  .progress .bar { display: flex; gap: 10px; align-items: center; color: var(--muted); font-size: 13px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1.2s infinite; flex: none; }
  @keyframes pulse { 50% { opacity: .25; } }
  .composer { display: flex; gap: 8px; margin-top: 8px; }
  .composer textarea { min-height: 42px; height: 42px; }
  .field { border-top: 1px solid var(--line); padding: 12px 0; }
  .field:first-child { border-top: none; }
  .field .fl { font-weight: 600; margin-bottom: 4px; display: flex; gap: 8px; align-items: baseline; }
  .diff { white-space: pre-wrap; word-break: break-word; }
  .diff del { background: var(--del-bg); color: var(--del-ink); text-decoration: line-through; }
  .diff ins { background: var(--ins-bg); color: var(--ins-ink); text-decoration: none; }
  .md h3 { margin: 4px 0 10px; font-size: 17px; }
  .docbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 12px 0 4px; }
  .docmeta { font-size: 12px; color: var(--muted); margin: 4px 0 8px; word-break: break-all; }
  .dl { white-space: pre-wrap; word-break: break-word; padding: 1px 6px; font-size: 13px; line-height: 1.6; border-left: 3px solid transparent; }
  .dl.del { background: var(--del-bg); color: var(--del-ink); border-left-color: var(--del-ink); }
  .dl.ins { background: var(--ins-bg); color: var(--ins-ink); border-left-color: var(--ins-ink); }
  .dl.mod { border-left-color: var(--accent); }
  .dl.mod del { background: var(--del-bg); color: var(--del-ink); } .dl.mod ins { background: var(--ins-bg); color: var(--ins-ink); text-decoration: none; }
  .dl.skip { color: var(--muted); font-style: italic; }
  .applybar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 12px 14px; background: var(--soft); border-radius: var(--radius); margin-top: 14px; }
  .newmsg { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); background: var(--accent); color: var(--accent-ink); border: none; border-radius: 999px; padding: 6px 16px; cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,.18); font-weight: 600; z-index: 5; }
  @media (min-width: 821px) { body:not(.side-off) .newmsg { left: calc(170px + 50%); } }
  .toast { position: fixed; right: 18px; bottom: 18px; background: var(--ink); color: var(--panel); padding: 9px 14px; border-radius: 8px; max-width: 420px; box-shadow: 0 6px 24px rgba(0,0,0,.2); }
  .welcome { color: var(--muted); padding-top: 12vh; text-align: center; }
  .newbtn { margin: 10px 12px 0; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: none; background: var(--panel); padding: 5px 14px; cursor: pointer; color: var(--muted); }
  .seg button.on { background: var(--ink); color: var(--panel); }
  .form label { display: block; font-weight: 600; margin: 14px 0 6px; }
  .form input[type=text], .form select { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; background: var(--bg); }
  .form textarea { min-height: 140px; }
  .seats { display: grid; gap: 8px; }
  .seat { border: 1px solid var(--line); border-left: 4px solid var(--c, var(--line)); border-radius: 8px; padding: 8px 10px; background: var(--bg); }
  .seat .st { display: grid; grid-template-columns: minmax(120px, 1.1fr) 92px minmax(110px, 1fr) minmax(120px, 1.2fr) 30px; gap: 6px; align-items: center; }
  .form .seat select, .form .seat input[type=text] { padding: 5px 8px; background: var(--panel); }
  .seat textarea { min-height: 40px; height: 52px; margin-top: 6px; background: var(--panel); font-size: 13px; }
  .seat .del { border: none; background: none; color: var(--muted); cursor: pointer; font-size: 15px; }
  .seat .del:hover { color: var(--err); }
  .lnbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
  .lnbar select { width: auto !important; }
  .form label .btn { font-weight: 400; font-size: 12px; padding: 1px 10px; margin-left: 8px; }
  @media (max-width: 640px) { .seat .st { grid-template-columns: 1fr 1fr; } .seat .del { justify-self: end; } }
  .chip.lark { color: #2a7de1; border-color: #2a7de1; }
  .chip.web { color: var(--muted); }
  .post.followup-start { margin-top: 22px; }
  /* 吸顶状态条：标题、状态、谁在写、结束原因、阻断数、子页签、轮次跳转 */
  .sticky { position: sticky; top: 0; z-index: 4; background: var(--bg); margin: -22px -4px 0; padding: 14px 4px 0; }
  .sticky .head { flex-wrap: nowrap; align-items: center; }
  .sticky .head h2 { font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1 1 auto; }
  .sticky .head .chip, .sticky .head .ops { flex: none; }
  .statline { display: flex; gap: 6px 14px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-top: 6px; }
  .statline .warn { color: var(--warn); font-weight: 600; }
  .statline .blk { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 0 10px; cursor: pointer; color: var(--muted); font-size: 12px; }
  .statline .blk.on { color: var(--err); border-color: var(--err); font-weight: 600; }
  .subtabs .tools { margin-left: auto; display: flex; gap: 6px; align-items: center; padding-bottom: 4px; }
  .subtabs .tools select, .subtabs .tools button { font-size: 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); padding: 2px 8px; color: var(--muted); cursor: pointer; }
  /* 按轮折叠 */
  .grp { margin-top: 12px; border: 1px solid var(--line); border-radius: var(--radius); background: color-mix(in srgb, var(--panel) 55%, transparent); scroll-margin-top: 130px; }
  .grp > .gh { display: flex; gap: 10px; align-items: baseline; width: 100%; text-align: left; background: none; border: none; padding: 9px 14px; cursor: pointer; flex-wrap: wrap; }
  .grp > .gh .caret::before { content: '▾'; color: var(--muted); display: inline-block; width: 10px; }
  .grp.closed > .gh .caret::before { content: '▸'; }
  .grp > .gh .gs { color: var(--muted); font-size: 12px; }
  .grp > .gh .gs .bad { color: var(--err); font-weight: 600; }
  .grp > .gh .unread { margin-left: auto; font-size: 11px; background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 0 8px; }
  .grp > .gh .unread:empty { display: none; }
  .grp > .gb { padding: 0 12px 12px; }
  .grp > .gb > .post:first-child { margin-top: 0; }
  .grp.closed > .gb { display: none; }
  .tagc { font-weight: 700; font-size: 12px; padding: 0 7px; border-radius: 5px; background: var(--soft); color: var(--accent); }
  /* 结论页 */
  .oneliner { font-size: 16px; font-weight: 600; border-left: 4px solid var(--accent); }
  .oneliner .md p { margin: 2px 0; }
  .card h3 .hint { font-weight: 400; margin-left: 6px; }
  .dsub { margin-top: 10px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); }
  .dsub.pick { border-color: var(--accent); background: var(--soft); }
  .dsub h4 { margin: 0 0 4px; font-size: 14px; }
  .pri { font-size: 11px; font-weight: 700; padding: 0 6px; border-radius: 4px; margin-right: 2px; white-space: nowrap; }
  .pri.first { background: var(--err); color: #fff; } .pri.later { background: var(--line); color: var(--ink); } .pri.block { background: var(--del-bg); color: var(--del-ink); }
  .blkbox { scroll-margin-top: 130px; }
  .blkbox.alert { border-color: var(--err); }
  .brow { margin-top: 8px; } .brow ul { margin: 4px 0 0; padding-left: 20px; }
  .banner { padding: 8px 12px; border-radius: 8px; background: var(--soft); font-size: 13px; margin-top: 14px; }
  .banner.warn { background: color-mix(in srgb, var(--warn) 15%, var(--panel)); }
  .divider { margin: 22px 0 4px; color: var(--muted); font-size: 12px; display: flex; gap: 8px; align-items: center; }
  .divider::before, .divider::after { content: ''; flex: 1; border-top: 1px dashed var(--line); }
  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; height: auto; }
    aside { max-height: 46vh; border-right: none; border-bottom: 1px solid var(--line); }
    .wrap { padding: 16px 16px 120px; }
    main { overflow: visible; } /* 窄屏滚动的是整页：main 不能是滚动容器，吸顶状态条和底部输入框才贴得住 */
    .sticky { margin-top: -16px; }
    .sticky .head { flex-wrap: wrap; }
    .sticky .head h2 { flex-basis: 100%; }
    .subtabs { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">
      <h1>ai-storm</h1>
      <button class="sidetoggle" id="closeSide" title="收起侧边栏（快捷键 [ ）" aria-label="收起侧边栏">⟨</button>
      <div class="sub" id="status">连接中…</div>
    </div>
    <div class="tabs" id="tabs"></div>
    <button class="btn primary newbtn" id="new">＋ 新讨论</button>
    <input class="search" id="search" placeholder="搜索（讨论里搜议题和发言内容）">
    <div class="filters" id="filters">
      <select id="fMode" title="模式"><option value="">全部模式</option><option value="quick">快问</option><option value="decision">方案讨论</option><option value="redraft">改稿</option><option value="brainstorm">脑洞风暴</option><option value="refine">作品打磨</option></select>
      <select id="fDays" title="时间"><option value="">全部时间</option><option value="7">最近 7 天</option><option value="30">最近 30 天</option><option value="90">最近 90 天</option></select>
      <label title="归档的讨论默认不在列表里"><input type="checkbox" id="fArchived">只看归档</label>
    </div>
    <div class="list" id="list"></div>
  </aside>
  <button class="sidetoggle" id="openSide" title="展开侧边栏（快捷键 [ ）" aria-label="展开侧边栏">☰</button>
  <main><div class="wrap" id="main"><div class="welcome">左边「讨论」里是群里和网页上的全部讨论；「脑洞 / 梗概 / 总纲」里挑一项可以做作品打磨。</div></div></main>
</div>
<script>
const TABS = [['runs', '讨论'], ['memory', '记忆'], ['idea', '脑洞'], ['premise', '梗概'], ['outline', '总纲']];
const MEM_LABEL = { work: '工作', personal: '个人', novel: '小说' };
// 各档位默认带的记忆域：只带一个，不跨域；个人域从不默认勾选（个人内容会发给所选模型的服务）
const memDefault = (tier) => (['brainstorm', 'redraft', 'refine'].includes(tier) ? ['novel'] : ['work']);
const TYPE_LABEL = { idea: '脑洞', premise: '梗概', outline: '总纲' };
const MODE_LABEL = { decision: '方案讨论', brainstorm: '脑洞风暴', refine: '作品打磨', quick: '快问', redraft: '改稿' };
const MODE_SHORT = { decision: '方案', brainstorm: '脑洞', refine: '打磨', quick: '快问', redraft: '改稿' };
// 新建页的档位：快问、小会（方案讨论的轻量版）、方案讨论、脑洞风暴
const TIERS = [['quick', '快问'], ['meeting', '小会'], ['decision', '方案讨论'], ['brainstorm', '脑洞风暴'], ['redraft', '改稿']];
const TIER_HINT = {
  quick: '一位回答、一位挑刺、回答的一方定稿，3 次模型调用，通常一两分钟。缺的信息写在结果里，用追问补充；不够深可以「升级为讨论」。',
  meeting: '两位主笔、一位评审，最多 3 轮，评审都没有新意见就提前结束。',
  decision: '完整的方案讨论：可以读代码、查数据、核实事实，多轮评审直到收敛。',
  brainstorm: '主笔发散脑洞，评审盲审，多轮修订后主编挑选。',
  redraft: '贴上一章原文：一位改稿、一位对照原文挑刺、改稿的一方定稿，3 次模型调用。产出修改说明、逐段对比和完整修改稿，自己复制回去，不写回墨稿。',
};
const modeOfTier = (t) => (t === 'meeting' ? 'decision' : t);
const CHANNEL_LABEL = { lark: '群里', web: '网页', 'dry-run': 'dry-run' };
const HANDLING_LABEL = { answer: '直接回答', discuss: '重新讨论', verdict: '按裁决定稿', verify: '核实' };
const STATUS_LABEL = { queued: '排队中', running: '进行中', done: '已结束', failed: '失败', idle: '已结束' };
// 结束原因：主讨论五种、追问专用三种，加上旧版追问记的 followup；只有僵局、分歧、到上限用警示色
const ENDING_LABEL = { converged: '评审都没有新意见（收敛）', max: '到轮数上限，评审仍有意见', fixed: '按固定轮数结束', deadlock: '僵局：主笔不改、评审仍有阻断', dissent: '评审之间有分歧', answered: '直接回答', verdict: '按裁决定稿', verified: '核实了事实', followup: '追问后重新讨论结束' };
const ENDING_WARN = new Set(['deadlock', 'dissent', 'max']);

// ---------- 极简 Markdown：加粗、行内代码、列表、代码块、小标题 ----------
function inline(s) {
  return esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/【先定】/g, '<span class="pri first">先定</span>').replace(/【可后定】/g, '<span class="pri later">可后定</span>')
    .replace(/^(\s*(?:<strong>)?)[【\[]阻断[】\]]/, '$1<span class="pri block">阻断</span>');
}
function md(text) {
  const out = []; let list = null; let code = null;
  const close = () => { if (list) { out.push(`</${list}>`); list = null; } };
  for (const line of String(text ?? '').split('\n')) {
    if (code !== null) { if (/^```/.test(line)) { out.push(`<pre>${esc(code)}</pre>`); code = null; } else code += (code ? '\n' : '') + line; continue; }
    if (/^```/.test(line)) { close(); code = ''; continue; }
    let m;
    if ((m = /^\s*[-*]\s+(.*)$/.exec(line))) { if (list !== 'ul') { close(); out.push('<ul>'); list = 'ul'; } out.push(`<li>${inline(m[1])}</li>`); continue; }
    if ((m = /^\s*\d+[.、)]\s+(.*)$/.exec(line))) { if (list !== 'ol') { close(); out.push('<ol>'); list = 'ol'; } out.push(`<li>${inline(m[1])}</li>`); continue; }
    close();
    if ((m = /^(#{1,6})\s+(.*)$/.exec(line))) { const h = Math.min(m[1].length + 2, 5); out.push(`<h${h}>${inline(m[2])}</h${h}>`); continue; }
    if (line.trim()) out.push(`<p>${inline(line)}</p>`);
  }
  if (code !== null) out.push(`<pre>${esc(code)}</pre>`);
  close();
  return `<div class="md">${out.join('')}</div>`;
}

// ---------- 修订版对比 ----------
function flatten(fields) {
  const rows = [];
  const text = (v) => (v === null || v === undefined ? '' : String(v));
  const walk = (obj, prefix) => {
    for (const [k, v] of Object.entries(obj)) {
      if (k === 'characters' && Array.isArray(v)) rows.push({ key: `${prefix}characters`, label: FIELD_LABELS.characters, value: v.map((c) => `${c.name}（${c.role}）：${c.description}`).join('\n') });
      else if (k === 'volumes' && Array.isArray(v)) v.forEach((vol, i) => { for (const [vk, vv] of Object.entries(vol)) rows.push({ key: `volumes.${i}.${vk}`, label: `第 ${i + 1} 卷 · ${vk === 'title' ? '卷名' : FIELD_LABELS[vk] || vk}`, value: text(vv) }); });
      else if (v && typeof v === 'object' && !Array.isArray(v)) walk(v, `${prefix}${k}.`);
      else rows.push({ key: `${prefix}${k}`, label: FIELD_LABELS[k] || k, value: Array.isArray(v) ? v.join('、') : text(v) });
    }
  };
  walk(fields, '');
  return rows;
}
function tokens(s) { return String(s).match(/[一-鿿]|[A-Za-z0-9_]+|\s+|[^一-鿿A-Za-z0-9_\s]/g) || []; }
function diffHtml(a, b) {
  const x = tokens(a), y = tokens(b);
  if (x.length * y.length > 4e6) return `<del>${esc(a)}</del><ins>${esc(b)}</ins>`;
  const n = x.length, m = y.length, dp = Array.from({ length: n + 1 }, () => new Uint32Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) dp[i][j] = x[i] === y[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const out = []; let i = 0, j = 0;
  const push = (t, s) => { const last = out[out.length - 1]; if (last && last.t === t) last.s += s; else out.push({ t, s }); };
  while (i < n && j < m) { if (x[i] === y[j]) { push('=', x[i]); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) push('-', x[i++]); else push('+', y[j++]); }
  while (i < n) push('-', x[i++]); while (j < m) push('+', y[j++]);
  return out.map((o) => (o.t === '=' ? esc(o.s) : o.t === '-' ? `<del>${esc(o.s)}</del>` : `<ins>${esc(o.s)}</ins>`)).join('');
}
// 两段文字有多像：按字和词的最长公共子序列占比（0~1）；太长不算，当作不像
function similarity(a, b) {
  const x = tokens(a), y = tokens(b);
  if (!x.length || !y.length) return 0;
  if (x.length * y.length > 4e6) return 0;
  let prev = new Uint32Array(y.length + 1);
  for (let i = 1; i <= x.length; i++) {
    const cur = new Uint32Array(y.length + 1);
    for (let j = 1; j <= y.length; j++) cur[j] = x[i - 1] === y[j - 1] ? prev[j - 1] + 1 : Math.max(prev[j], cur[j - 1]);
    prev = cur;
  }
  return prev[y.length] / Math.max(x.length, y.length);
}
// 文档编号：旧版本没有 docNo 的都算第 1 份
const docNoOf = (d) => d.docNo || 1;
const docTitleOf = (d) => d.title || ((d.text || '').split('\n').find((l) => /^#\s/.test(l)) || '主文档').replace(/^#\s+/, '');
// 变更记录：每版一行「第 N 版（原因）：说明」，和导出的一致
function changelogOf(list) {
  const cut = (t, n = 100) => (t.length > n ? `${t.slice(0, n)}…` : t);
  const flat = (t) => cut(String(t || '').replace(/\*\*/g, '').split('\n').map((l) => l.replace(/^[-*\s]+/, '').trim()).filter(Boolean).join('；'));
  return list.map((d) => {
    const from = d.opened ? `新开文档${d.opened.from ? `（从《${d.opened.from}》分出）` : ''}，原因：${cut(d.opened.reason || '（没写）')}` : '';
    return `第 ${d.version} 版（${d.reason}${d.at ? `，${d.at.slice(0, 10)}` : ''}）：${[from, flat(d.note)].filter(Boolean).join('。') || '（没有说明）'}`;
  });
}
// 主文档两版之间按行对比：改了一行的显示行内差异，大段没变的折叠
function lineDiffHtml(a, b) {
  const x = a ? String(a).split('\n') : [], y = b ? String(b).split('\n') : [];
  const n = x.length, m = y.length;
  if (n * m > 4e6) return `<div class="dl del">${esc(a)}</div><div class="dl ins">${esc(b)}</div>`;
  const dp = Array.from({ length: n + 1 }, () => new Uint32Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) dp[i][j] = x[i] === y[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const ops = []; let i = 0, j = 0;
  while (i < n && j < m) { if (x[i] === y[j]) { ops.push({ t: '=', s: x[i] }); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) ops.push({ t: '-', s: x[i++] }); else ops.push({ t: '+', s: y[j++] }); }
  while (i < n) ops.push({ t: '-', s: x[i++] }); while (j < m) ops.push({ t: '+', s: y[j++] });
  const out = [];
  for (let k = 0; k < ops.length;) {
    if (ops[k].t === '=') {
      let e = k; while (e < ops.length && ops[e].t === '=') e++;
      const run = ops.slice(k, e).map((o) => o.s);
      // 没变的段落只留首尾各 2 行
      if (run.length > 6 && k > 0 && e < ops.length) out.push(...run.slice(0, 2).map((l) => `<div class="dl">${esc(l) || '&nbsp;'}</div>`), `<div class="dl skip">…… ${run.length - 4} 行没变 ……</div>`, ...run.slice(-2).map((l) => `<div class="dl">${esc(l) || '&nbsp;'}</div>`));
      else if (run.length > 4 && (k === 0 || e === ops.length)) { const keep = k === 0 ? run.slice(-2) : run.slice(0, 2); if (k === 0) out.push(`<div class="dl skip">…… ${run.length - 2} 行没变 ……</div>`); out.push(...keep.map((l) => `<div class="dl">${esc(l) || '&nbsp;'}</div>`)); if (k !== 0) out.push(`<div class="dl skip">…… ${run.length - 2} 行没变 ……</div>`); }
      else out.push(...run.map((l) => `<div class="dl">${esc(l) || '&nbsp;'}</div>`));
      k = e; continue;
    }
    let e = k; while (e < ops.length && ops[e].t !== '=') e++;
    const del = ops.slice(k, e).filter((o) => o.t === '-').map((o) => o.s), ins = ops.slice(k, e).filter((o) => o.t === '+').map((o) => o.s);
    // 一行对一行、改得不多时标行内差异；改得多（大半都换了）时上下分开显示原文和新文，比逐字穿插好读
    if (del.length === ins.length) out.push(...del.map((d, q) => (similarity(d, ins[q]) >= 0.5 ? `<div class="dl mod diff">${diffHtml(d, ins[q])}</div>` : `<div class="dl del">${esc(d) || '&nbsp;'}</div><div class="dl ins">${esc(ins[q]) || '&nbsp;'}</div>`)));
    else out.push(...del.map((l) => `<div class="dl del">${esc(l) || '&nbsp;'}</div>`), ...ins.map((l) => `<div class="dl ins">${esc(l) || '&nbsp;'}</div>`));
    k = e;
  }
  return out.join('') || '<div class="dl skip">两版一样</div>';
}
function compare(before, after) {
  const a = new Map(flatten(before).map((r) => [r.key, r])), b = new Map(flatten(after).map((r) => [r.key, r]));
  const keys = [...new Set([...a.keys(), ...b.keys()])];
  return keys.map((k) => ({ key: k, label: (b.get(k) || a.get(k)).label, before: a.get(k)?.value ?? null, after: b.get(k)?.value ?? null }))
    .filter((r) => r.before !== r.after);
}

// 绑定阵容编辑；onChange 在阵容是否可用变化时调用（用来启用 / 禁用开始按钮）
function bindLineup(mode, onChange) {
  const l = lineupOf(mode);

    const problem = lineupProblem(l, mode);
    const leads = l.participants.filter((p) => p.part !== 'reviewer').length;
    $('lnHint').innerHTML = problem ? `<span class="err">${esc(problem)}</span>` : twoSeats(mode) ? '' : `${leads} 位主笔${l.participants.length - leads ? `、${l.participants.length - leads} 位评审` : ''}`;
    $('lnAdd').disabled = l.participants.length >= (S.status?.maxSeats || 8);
    onChange?.(!problem);
  };
  const redraw = () => { $('seats').innerHTML = seatsHtml(mode); refresh(); };
  const seatOf = (el) => { const box = el.closest('.seat'); return box ? Number(box.dataset.i) : -1; };
  $('seats').addEventListener('input', (ev) => {
    const k = ev.target.dataset.k, i = seatOf(ev.target);
    if (i < 0 || (k !== 'role' && k !== 'persona')) return;

    if (i < 0) return;

    if (k === 'tpl' && ev.target.value) {
      const t = (S.status?.roleTemplates || []).find((x) => x.name === ev.target.value);

// ---------- 一场讨论 ----------
function closeStream() { if (S.es) { S.es.close(); S.es = null; } clearInterval(S.ticker); hideNewMsg(); }
// 重新取一场讨论的详情并重绘，保持当前子页、展开的组和滚动位置
async function refreshRun(number) {
  const fresh = await api(`/api/runs/${number}`).catch(() => null);
  if (!fresh || S.run?.number !== number) return null;
  const s = scroller(), top = s.scrollTop;
  S.run = fresh; renderRun(); s.scrollTop = top;
  return fresh;
}

// 子页：方案讨论有主文档时「结论 / 讨论 / 文档」；只有旧版汇总时「结论（旧版汇总） / 讨论」
function tabsOf(r) {
  const docs = r.docs || [];
  const docCount = new Set(docs.map(docNoOf)).size;
  const docTab = ['doc', docCount > 1 ? `文档 · ${docCount} 份` : docs.length ? `文档 · 第 ${docs[docs.length - 1].version} 版` : '文档（还没有）'];
  const revs = r.revisions?.length ? r.revisions : r.revision ? [r.revision] : [];
  if (r.mode === 'refine') return [['talk', '讨论'], docTab, ['rev', `修订版${revs.length ? '' : '（还没有）'}`], ['orig', '原稿']];
  if (!docs.length && r.summary) return [['conclusion', '结论（旧版汇总）'], ['talk', '讨论']];
  if (['decision', 'quick', 'redraft'].includes(r.mode)) return [['concl', '结论'], ['talk', '讨论'], docTab];
  return [['talk', '讨论'], docTab];
}
// 默认落点只在打开讨论时决定：已结束且有主文档进结论页；没有主文档进旧版汇总，再没有进讨论页；进行中进讨论页
function landingOf(r) {

    : left ? `<div class="row">存进 <select id="memDomain">${ms.map((m) => `<option value="${m.id}" ${m.id === def ? 'selected' : ''}>${esc(m.label)}</option>`).join('')}</select><button class="btn primary" data-memsave="${r.number}">存入记忆</button><span class="hint">之后发起讨论时勾选这个域就会带上；在左边「记忆」里能查看和删除。</span></div>` : '';
  return `<div class="card" id="memoBox"><h3>存入记忆<span class="hint">${who}提议的、以后可能反复用到的结论；你勾选确认后才会存</span></h3>${rows}${bar}</div>`;
}
async function saveMemo(btn) {
  const number = Number(btn.dataset.memsave);
  const items = [...document.querySelectorAll('[data-memitem]:checked')].map((x) => S.memoItems[Number(x.dataset.memitem)]).filter(Boolean);
  if (!items.length) { toast('先勾选要存的结论'); return; }
  const domain = $('memDomain').value;
  btn.disabled = true;
  try {
    const res = await api('/api/memory/save', { method: 'POST', body: JSON.stringify({ number, domain, items }) });
    toast(`存入「${MEM_LABEL[domain]}」${res.saved.length} 条${res.skipped.length ? `，${res.skipped.length} 条已经有了` : ''}`);
    await refreshRun(number); loadStatus(); loadMemory();
  } catch (e) { toast(e.message); btn.disabled = false; }
}

function conclHtml(r, status) {
  const live = status === 'running' || status === 'queued';
  const secs = r.docSections || [];
  if (!secs.length) return `<div class="card hint">${live ? '讨论结束后生成。' : '这场讨论没有主文档。'}</div>${live ? '' : blockerBoxHtml(r.blockers, r.outcome)}`;
  // 一场讨论可以有几份文档：和「文档」页共用选中的那份，默认最近改过的
  const docs = r.docs || [];
  const nos = secs.map((s) => s.docNo);
  const no = nos.includes(S.docNo) ? S.docNo : docNoOf(docs[docs.length - 1]);
  const s = secs.find((x) => x.docNo === no) || secs[secs.length - 1];
  const doc = docs.find((d) => d.version === s.version);
  const titleOf = (n) => docTitleOf(docs.filter((d) => docNoOf(d) === n).pop() || {});
  const head = `${nos.length > 1 ? `<div class="docbar">${nos.map((n) => `<button class="btn ${n === s.docNo ? 'primary' : ''}" data-docno="${n}">《${esc(titleOf(n))}》</button>`).join('')}</div>` : ''}
    ${live || r.outcome?.followUpStatus === 'running' ? '<div class="banner">追问进行中，下面是上一版主文档的结论。</div>' : ''}`;
  const tail = `<div class="card"><h3>结束状态</h3>${endingHtml(r.outcome, r.mode) || '<span class="hint">结束原因未知</span>'}
      ${r.outcome?.followUpStatus === 'failed' ? '<div class="warn" style="color:var(--warn)">最近一次追问没有完成，结束原因取的是前一次。</div>' : ''}
      ${typeof r.outcome?.facts === 'number' ? `<div class="hint">讨论中核实了 ${r.outcome.facts} 个问题。</div>` : ''}</div>
    ${blockerBoxHtml(r.blockers, r.outcome)}
    <div class="row"><button class="btn" data-sub="doc">看全文（第 ${s.version} 版）</button></div>`;
  if (s.failed && r.mode === 'quick') return `${head}<div class="banner warn">未能提取结论，下面显示全文。</div><div class="card">${md(doc?.text || '')}</div><div class="row"><button class="btn primary" data-upgrade="1">升级为讨论</button></div>`;
  if (s.failed && r.mode !== 'redraft') return `${head}<div class="banner warn">未能提取结论（主文档里缺少：${esc((s.missing || []).map((k) => ({ points: '要点', decisions: '要拍板的事', next: '下一步' }[k] || k)).join('、') || '大纲')}），下面显示全文。</div><div class="card">${md(doc?.text || '')}</div>${tail}`;
  const sec = (x, title) => (x ? `<div class="card"><h3>${esc(title || x.title)}</h3>${md(x.text)}</div>` : '');
  if (r.mode === 'redraft') {
    const draft = doc?.attachments?.['修改稿'] || '';
    const view = S.draftView === 'full' ? 'full' : 'diff';
    const draftBox = draft ? `<div class="card" id="draftBox"><h3>修改稿<span class="hint">${draft.length} 字，原文 ${(r.material || '').length} 字</span></h3>
      <div class="docbar"><button class="btn ${view === 'diff' ? 'primary' : ''}" data-draftview="diff">逐段对比</button><button class="btn ${view === 'full' ? 'primary' : ''}" data-draftview="full">修改稿全文</button><button class="btn" data-copydraft="1">复制修改稿</button></div>
      ${view === 'diff' ? `<div style="margin-top:8px">${lineDiffHtml(r.material || '', draft)}</div>` : `<div class="pre" style="margin-top:8px">${esc(draft)}</div>`}</div>`
      : '<div class="banner warn">这一版没有「修改稿」附录：完整修改稿在「讨论」页第一张改稿卡片的「修改稿全文」里，也可以追问「把修改稿完整写出来」。</div>';
    S.draftText = draft;
    return `${head}
      ${s.oneLiner ? `<div class="card oneliner">${md(s.oneLiner)}</div>` : ''}
      ${s.failed ? `<div class="banner warn">未能提取修改说明，下面显示全文。</div><div class="card">${md(doc?.text || '')}</div>` : [sec(s.notes, '修改说明'), sec(s.rejected, '没采纳的意见'), memoCardHtml(r, s)].join('')}
      ${draftBox}
      <div class="row"><button class="btn" data-sub="doc">看文档页（第 ${s.version} 版）</button><span class="hint">${r.expired ? '已超过保留期，不能再追问。' : '在下面追问接着改，改稿的一方会更新修改稿。'}</span></div>`;
  }
  if (r.mode === 'quick') {
    const QUICK_TITLE = { answer: '回答', blind: '你可能没考虑到的', need: '需要你补充的', next: '下一步', memo: '可存入知识库的结论' };
    return `${head}
      ${s.oneLiner ? `<div class="card oneliner">${md(s.oneLiner)}</div>` : ''}
      ${(s.order || []).map((k) => (k === 'memo' ? memoCardHtml(r, s) : sec(s[k], QUICK_TITLE[k]))).join('')}
      <div class="row"><button class="btn primary" data-upgrade="1" title="把问题和这份结果带进新建页，按方案讨论或小会再讨论一次">升级为讨论</button><button class="btn" data-sub="doc">看全文（第 ${s.version} 版）</button>
        <span class="hint">${r.expired ? '已超过保留期，不能再追问，可以升级为讨论。' : '在下面追问补充信息，回答的一方会直接回答并更新这份文档。'}</span></div>`;
  }
  const d = s.decisions;
  const decisions = d ? `<div class="card"><h3>${esc(d.title)}</h3>${d.lead ? md(d.lead) : ''}${d.parts.map((p) => `<div class="dsub ${p.pick ? 'pick' : ''}"><h4>${esc(p.title)}</h4>${md(p.text)}</div>`).join('')}</div>` : '';
  return `${head}
    ${s.oneLiner ? `<div class="card oneliner">${md(s.oneLiner)}</div>` : ''}
    ${sec(s.points, '要点')}${decisions}${sec(s.next, '下一步')}${sec(s.risks)}${memoCardHtml(r, s)}
    ${tail}`;
}

function renderRun() {
  const r = S.run, p = r.progress || {};
  const status = p.status === 'idle' ? 'done' : p.status;
  const revs = r.revisions?.length ? r.revisions : r.revision ? [r.revision] : [];
  const refine = r.mode === 'refine';
  const chips = `<span class="chip ${status}">${STATUS_LABEL[status] || status}</span><span class="chip">${MODE_LABEL[r.mode] || r.mode}</span><span class="chip ${r.channel}">${CHANNEL_LABEL[r.channel] || r.channel}</span>${r.mock ? '<span class="chip">mock</span>' : ''}`;
  const title = refine && r.subject ? `${TYPE_LABEL[r.subject.type]}「${esc(r.subject.title)}」` : esc((r.topic || '').split('\n')[0].slice(0, 80));
  const docs = r.docs || [];
  const tabs = tabsOf(r);
  if (!tabs.some(([k]) => k === S.sub)) S.sub = tabs[0][0] === 'concl' && !docs.length ? 'talk' : tabs[0][0];
  $('main').innerHTML = `
    <div class="sticky">
      <div class="head"><h2>#${r.number} · ${title}</h2>${chips}${r.archived ? '<span class="chip">已归档</span>' : ''}<span class="ops"><button id="archiveBtn">${r.archived ? '取消归档' : '归档'}</button><button id="deleteBtn" class="danger" ${status === 'running' || status === 'queued' ? 'disabled title="进行中或排队中的讨论不能删"' : ''}>删除</button></span></div>
      <div class="statline" id="statline"></div>
      <div class="subtabs">${tabs.map(([k, l]) => `<button class="subtab ${S.sub === k ? 'on' : ''}" data-sub="${k}">${l}</button>`).join('')}<span class="tools" id="tools"></span></div>
    </div>
    <div class="meta">${refine ? `作者的要求：${esc(r.topic || '（没有额外要求）')}` : (r.topic || '').includes('\n') ? `<details><summary>完整${r.mode === 'quick' ? '问题' : '议题'}</summary><div class="pre">${esc(r.topic)}</div></details>` : ''}${r.material ? `<details><summary>材料（${r.material.length} 字）</summary><div class="pre">${esc(r.material)}</div></details>` : ''}${[r.code ? `代码：${r.code.auto ? '调研员按议题定位' : esc(r.code.repos.join('；'))}` : '', r.data?.tools ? '数据工具' : '', r.data?.knowledge?.length ? `知识：${esc(r.data.knowledge.join('、'))}` : '', r.followUps.length ? `追问 ${r.followUps.length} 次` : ''].filter(Boolean).join(' · ')}</div>
    <div id="pane"></div>
    <div class="progress" id="progress"><div class="bar"></div><div class="composer"></div></div>`;
  renderStat(); renderTools(); renderProgress();
  $('archiveBtn').onclick = async () => {
    try {
      const res = await api(`/api/runs/${r.number}/archive`, { method: 'POST', body: JSON.stringify({ archived: !r.archived }) });
      toast(res.archived ? `#${r.number} 已归档，勾选「只看归档」可以找到` : `#${r.number} 已取消归档`);
      S.run.archived = res.archived; renderRun(); loadRuns();
    } catch (e) { toast(e.message); }
  };
  $('deleteBtn').onclick = async () => {
    if (!confirm(`删除 #${r.number}？它的发言、主文档、追问和用量记录都会删掉，不能恢复。`)) return;
    try {
      await api(`/api/runs/${r.number}/delete`, { method: 'POST', body: '{}' });
      toast(`#${r.number} 已删除`);
      closeStream(); S.run = null; $('main').innerHTML = '<div class="welcome">已删除。</div>'; loadRuns();
    } catch (e) { toast(e.message); }
  };
  const pane = $('pane');
  if (S.sub === 'talk') {
    pane.innerHTML = `<div id="posts">${postsHtml(r.posts)}</div>`;
  } else if (S.sub === 'concl') {
    pane.innerHTML = conclHtml(r, status);
  } else if (S.sub === 'conclusion') {
    const asked = r.followUps.filter((f) => f.answer);
    pane.innerHTML = r.conclusion
      ? `<div class="card">${md(r.conclusion)}</div>${asked.length ? `<div class="card"><h3>追问</h3>${asked.map((f) => `<details style="margin-top:8px"><summary>${esc(f.question)}（${HANDLING_LABEL[f.handling] || f.handling}）</summary>${md(f.answer)}</details>`).join('')}</div>` : ''}`
      : `<div class="card hint">${status === 'running' || status === 'queued' ? '讨论结束后这里显示主席的汇总。' : '这场讨论没有汇总。'}</div>`;
  } else if (S.sub === 'doc') {
    if (!docs.length) { pane.innerHTML = `<div class="card hint">${status === 'running' || status === 'queued' ? '讨论结束后主席会写主文档，主笔核对后发在这里。' : r.docFailed ? '主席没能写出主文档。「讨论」页最后有一张程序整理的结果（各主笔的最终方案、评审最后提的阻断、没核实的问题）。可以在终端运行 node src/cli.js doc ' + r.number + ' 补写。' : r.summary ? '这场讨论还没有主文档（旧讨论只有汇总）。可以在终端运行 node src/cli.js doc ' + r.number + ' 补写。' : '这场讨论没有主文档。'}</div>`; return; }
    // 一场讨论可以有几份文档（主席按方向新开的）：先选文档，再选这份文档的版本
    const nos = [...new Set(docs.map(docNoOf))];
    const no = nos.includes(S.docNo) ? S.docNo : docNoOf(docs[docs.length - 1]);
    const mine = docs.filter((v) => docNoOf(v) === no);
    const idx = Math.min(S.docIdx ?? mine.length - 1, mine.length - 1);
    const d = mine[idx], prev = mine[idx - 1];
    const diff = S.docDiff && prev;
    const check = d.check ? (d.check.issues ? `主笔核对提了 ${d.check.issues} 份意见${d.check.fixed ? '，已按意见修改' : ''}` : '主笔核对没有意见') : '';
    const atts = Object.entries(d.attachments || {});
    const gone = diff ? Object.keys(prev.attachments || {}).filter((k) => !(k in (d.attachments || {}))) : [];
    const asked = r.followUps.filter((f) => f.question);
    const latestOf = (n) => docs.filter((v) => docNoOf(v) === n).pop();
    pane.innerHTML = `
      ${nos.length > 1 ? `<div class="docbar">${nos.map((n) => `<button class="btn ${n === no ? 'primary' : ''}" data-docno="${n}">《${esc(docTitleOf(latestOf(n)))}》</button>`).join('')}</div>` : ''}
      <div class="docbar">${mine.map((v, i) => `<button class="btn ${i === idx ? 'primary' : ''}" data-docv="${i}" title="${esc(v.reason)}">第 ${v.version} 版</button>`).join('')}
        ${prev ? `<button class="btn" data-docdiff="1">${diff ? '看全文' : `和第 ${prev.version} 版对比`}</button>` : ''}
        <a class="btn" href="/api/runs/${r.number}/docs/${d.version}.md" download title="下载第 ${d.version} 版（Markdown，含附录和变更记录）">导出第 ${d.version} 版</a>
        ${r.mode === 'brainstorm' ? '<button class="btn" data-carry="quick" title="把这份结论放进材料框，发起一次快问">带着结论快问</button><button class="btn" data-carry="decision" title="把这份结论放进材料框，发起一场方案讨论">带着结论讨论</button>' : ''}</div>
      <div class="docmeta">${esc(d.reason)} · ${new Date(d.at).toLocaleString('zh-CN', { hour12: false })}${check ? ` · ${check}` : ''}</div>
      ${d.opened ? `<div class="card hint">新开的文档${d.opened.from ? `，从《${esc(d.opened.from)}》分出` : ''}。原因：${esc(d.opened.reason || '（没写）')}</div>` : ''}
      <div class="card">${diff ? lineDiffHtml(prev.text, d.text) : md(d.text)}</div>
      ${atts.map(([title, text]) => `<div class="card"><details ${diff ? 'open' : ''}><summary>附录《${esc(title)}》${diff && !(title in (prev.attachments || {})) ? ' <span class="chip">新增</span>' : ''}</summary>${diff ? lineDiffHtml(prev.attachments?.[title] ?? '', text) : md(text)}</details></div>`).join('')}
      ${gone.map((title) => `<div class="card hint">附录《${esc(title)}》在这一版删掉了</div>`).join('')}
      <div class="card"><details><summary>变更记录（${idx + 1} 版）</summary><ul>${changelogOf(mine.slice(0, idx + 1)).map((l) => `<li>${esc(l)}</li>`).join('')}</ul></details></div>
      ${asked.length ? `<div class="card"><h3>追问记录</h3>${asked.map((f) => `<details style="margin-top:8px"><summary>${esc(f.question)}（${HANDLING_LABEL[f.handling] || f.handling}${f.context === 'fresh' ? ' · 新会话' : ''}${f.doc ? ` → 第 ${f.doc} 版` : ''}）</summary>${md(f.answer || '（没有结论）')}</details>`).join('')}</div>` : ''}`;
  } else if (S.sub === 'orig') {
    pane.innerHTML = `<div class="card"><div class="pre">${esc(r.subject.current)}</div></div><div class="card"><details><summary>背景</summary><div class="pre" style="margin-top:8px">${esc(r.subject.background)}</div></details></div>`;
  } else {
    if (!revs.length) { pane.innerHTML = `<div class="card hint">${status === 'running' || status === 'queued' ? '讨论结束后主编会写出修订版。' : '这场打磨没有产出修订版。可以追问「按汇总重写修订版」。'}</div>`; return; }
    const idx = S.revIdx ?? revs.length - 1;
    const rev = revs[idx];
    const rows = compare(r.subject.fields, rev.fields);
    const isLatest = idx === revs.length - 1;
    const appliedThis = r.applied?.revisionAt === rev.at;
    pane.innerHTML = `
      ${revs.length > 1 ? `<div class="row"><span class="hint">版本：</span>${revs.map((v, i) => `<button class="btn ${i === idx ? 'primary' : ''}" data-rev="${i}">${i === 0 ? '讨论结束' : `追问后 ${i}`}</button>`).join('')}</div>` : ''}
      <div class="applybar">
        <span>和原稿相比改了 <b>${rows.length}</b> 处。${appliedThis ? `已于 ${new Date(r.applied.at).toLocaleString('zh-CN')} 写回墨稿。` : r.applied ? '之前写回过另一版。' : ''}</span>
        ${isLatest && !appliedThis && rows.length ? `<button class="btn primary" id="apply" ${r.mock || status === 'running' || status === 'queued' ? 'disabled' : ''}>写回墨稿</button>` : ''}
        <span class="hint">${r.mock ? 'mock 演练的修订版不写回。' : isLatest ? '写回会替换墨稿里的这一项；总纲写回前墨稿会自动存一份历史版本。' : '只能写回最新一版。'}</span>
      </div>
      <div class="card">${rows.length ? rows.map((x) => `<div class="field"><div class="fl">${esc(x.label)}${x.before === null ? '<span class="chip">新增</span>' : x.after === null ? '<span class="chip">删除</span>' : ''}</div><div class="diff">${diffHtml(x.before ?? '', x.after ?? '')}</div></div>`).join('') : '<span class="hint">修订版和原稿一样。</span>'}</div>`;
    const btn = $('apply');
    if (btn) btn.onclick = async () => {
      const ok = confirm(`确认把修订版写回墨稿？\n\n会替换${TYPE_LABEL[r.subject.type]}「${r.subject.title}」的 ${rows.length} 处内容。${r.subject.type === 'outline' ? '\n写回前墨稿会存一份历史版本，可以在大纲页恢复。' : '\n墨稿里没有历史版本；原稿在这里的「原稿」页能看到。'}`);
      if (!ok) return;
      btn.disabled = true;
      try { await api(`/api/runs/${r.number}/apply`, { method: 'POST', body: JSON.stringify({ revisionAt: rev.at }) }); toast('已写回墨稿'); S.run = await api(`/api/runs/${r.number}`); renderRun(); loadRuns(); loadItems(); }
      catch (e) { toast(e.message, 6000); btn.disabled = false; }
    };
  }
}

// 快问「升级为讨论」：问题照搬，快问结果和原来的材料放进材料框，默认选小会，可以改档位和阵容再开始
function upgradeQuick() {
  const r = S.run; if (!r) return;
  const doc = (r.docs || []).at(-1);
  const max = S.status?.materialMax || 30000;
  let material = [r.material ? `## 原来的材料\n${r.material}` : '', `## 快问 #${r.number} 的结果${doc ? `（第 ${doc.version} 版）` : ''}\n${doc?.text || r.summary || ''}`].filter(Boolean).join('\n\n');
  if (material.length > max) material = `${material.slice(0, max - 20)}\n（超出上限，已截断）`;
  const mem = (r.memory?.domains || []).map((d) => d.id);
  S.form = { tier: 'meeting', topic: r.topic, material, advOpen: false, ...(mem.length ? { memory: mem, memoryTouched: true } : {}) };
  openForm();
  toast('已把问题和快问结果带进来，确认档位后点「开始」');
}

// 复制：优先用剪贴板接口，不行时退回选中一个临时文本框复制
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return; } catch { /* 退回下面的做法 */ }
  const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.append(ta); ta.select();
  const ok = document.execCommand('copy'); ta.remove();
  if (!ok) throw new Error('copy failed');
}
// 灵感延续：脑洞风暴的结论放进材料框，带着去发起一次快问或讨论
function carryOn(tier) {
  const r = S.run; if (!r) return;
  const doc = (r.docs || []).at(-1);
  const max = S.status?.materialMax || 30000;
  let material = `## 脑洞风暴 #${r.number} 的结论${doc ? `（第 ${doc.version} 版）` : ''}\n${doc?.text || r.summary || ''}`;
  if (material.length > max) material = `${material.slice(0, max - 20)}\n（超出上限，已截断）`;
  S.form = { tier, topic: '', material, memory: ['novel'], memoryTouched: true };
  openForm();
  toast('脑洞风暴的结论已放进材料框，写下接着想问的再开始');
}

// ---------- 事件 ----------
document.addEventListener('click', (ev) => {
  const t = ev.target.closest('[data-tab],[data-type],[data-run],[data-sub],[data-rev],[data-docv],[data-docno],[data-docdiff],[data-grp],[data-allgrp],[data-blkjump],[data-upgrade],[data-mem],[data-memdel],[data-memsave],[data-draftview],[data-copydraft],[data-carry],.more');
  if (!t) return;
  if (t.matches('.more')) { const post = t.closest('.post'); post.classList.remove('fold'); t.remove(); return; }
  ev.preventDefault();
  if (t.dataset.grp) { setOpen(t.dataset.grp, !S.expanded.has(t.dataset.grp)); return; }
  if (t.dataset.allgrp) { for (const b of blocksOf(S.run.posts).filter((x) => x.key)) setOpen(b.id, t.dataset.allgrp === '1'); return; }
  if (t.dataset.blkjump) { blockerJump(); return; }
  if (t.dataset.upgrade) { upgradeQuick(); return; }
  if (t.dataset.draftview) { S.draftView = t.dataset.draftview; renderRun(); return; }
  if (t.dataset.copydraft) { copyText(S.draftText || '').then(() => toast('修改稿已复制')).catch(() => toast('复制失败，切到「修改稿全文」手动选中复制')); return; }
  if (t.dataset.carry) { carryOn(t.dataset.carry); return; }
  if (t.dataset.memdel) {
    if (!confirm('删除这条记忆？之后的讨论不会再带上它。')) return;
    api('/api/memory/delete', { method: 'POST', body: JSON.stringify({ domain: S.memSel, id: t.dataset.memdel }) })
      .then(async () => { toast('已删除'); await loadMemory(); openMemory(S.memSel); loadStatus(); }).catch((e) => toast(e.message));
    return;
  }
  if (t.dataset.memsave) { saveMemo(t); return; }
  if (t.dataset.mem) { openMemory(t.dataset.mem); return; }
  if (t.dataset.tab) { S.tab = t.dataset.tab; renderTabs(); renderList(); if (S.tab === 'runs') loadRuns(); if (S.tab === 'memory') loadMemory(); }
  else if (t.dataset.run) openRun(Number(t.dataset.run));
  else if (t.dataset.type) openItem(t.dataset.type, t.dataset.id);
  else if (t.dataset.sub) { hideNewMsg(); S.sub = t.dataset.sub; renderRun(); }
  else if (t.dataset.rev) { S.revIdx = Number(t.dataset.rev); renderRun(); }
  else if (t.dataset.docv) { S.docIdx = Number(t.dataset.docv); renderRun(); }
  else if (t.dataset.docno) { S.docNo = Number(t.dataset.docno); S.docIdx = null; S.docDiff = false; renderRun(); }
  else if (t.dataset.docdiff) { S.docDiff = !S.docDiff; renderRun(); }
});
let searchTimer;
$('search').addEventListener('input', (e) => {
  S.q = e.target.value;
  if (S.tab !== 'runs') return renderList();
  clearTimeout(searchTimer); searchTimer = setTimeout(loadRuns, 250); // 讨论在服务端搜，停下来再查
});
$('fMode').onchange = (e) => { S.filter.mode = e.target.value; loadRuns(); };
$('fDays').onchange = (e) => { S.filter.days = e.target.value; loadRuns(); };
$('fArchived').onchange = (e) => { S.filter.archived = e.target.checked; loadRuns(); };
$('new').onclick = () => openForm();
// 侧边栏收起 / 展开：记在本机浏览器里，下次打开保持
function setSide(off) {
  document.body.classList.toggle('side-off', off);
  try { localStorage.setItem('ai-storm.sideOff', off ? '1' : '0'); } catch { /* 隐私模式等存不了就算了 */ }
}
try { if (localStorage.getItem('ai-storm.sideOff') === '1') document.body.classList.add('side-off'); } catch { /* 同上 */ }
$('closeSide').onclick = () => setSide(true);
$('openSide').onclick = () => setSide(false);
document.addEventListener('keydown', (ev) => {
  if (ev.key !== '[' || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  if (ev.target instanceof Element && ev.target.closest('input, textarea, select, [contenteditable]')) return; // 打字时不触发
  ev.preventDefault();
  setSide(!document.body.classList.contains('side-off'));
});
renderTabs();
loadStatus().then(() => Promise.all([loadItems(), loadRuns(), loadMemory()]));
setInterval(loadStatus, 10000);
setInterval(loadRuns, 10000);
</script>
